name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Upload debug APK (manual install only)
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug


  android-ui:
    # Native shell commands instead of legacy Node.js 20 emulator actions.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Enable Linux KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo "::error::Android emulator hardware acceleration unavailable on this runner"
            exit 1
          fi
      - name: Install Android SDK and emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" \
            "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Start headless Android emulator
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n group7-ui -k "system-images;android-35;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd group7-ui \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 \
            > "$RUNNER_TEMP/group7-emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          booted=0
          for attempt in $(seq 1 180); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::Android emulator did not complete boot"
            tail -100 "$RUNNER_TEMP/group7-emulator.log"
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Run Android UI and SQLite instrumentation
        run: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-instrumentation
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-emulator-diagnostics
          path: ${{ runner.temp }}/group7-emulator.log
          retention-days: 7
          if-no-files-found: warn
