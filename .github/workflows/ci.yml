name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Upload debug APK (manual install only)
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug


  android-ui:
    # ReactiveCircus android-emulator-runner@v2 was verified to use Node.js 24.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable Linux KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo "::error::Android emulator hardware acceleration unavailable on this runner"
            exit 1
          fi
      - name: Install build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Run Compose UI and SQLite tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-instrumentation-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn

  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Check release configuration and backup exclusions
        run: python3 scripts/verify_release_candidate.py --source-only
      - name: Build unsigned minified release APK and AAB, run tests and release lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify unsigned package metadata and hashes
        run: python3 scripts/verify_release_candidate.py
      - name: Upload release audit metadata only
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-unsigned-release-audit
          path: app/build/outputs/release-candidate/audit.json
          if-no-files-found: error
          retention-days: 7

  signing-smoke:
    # Test signing only: ephemeral, disposable key generated fresh by CI.
    # NEVER publish or upload the APK, AAB, keystore, or password.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Create disposable CI-only upload key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ci-only-budget-tracker-signing.p12"
          keytool -genkeypair -noprompt -alias ci-only-release \
            -keyalg RSA -keysize 3072 -validity 2 -storetype PKCS12 \
            -dname "CN=CI signing test only,O=Not for distribution,C=US" \
            -keystore "$key" -storepass ci-smoke-not-a-secret \
            -keypass ci-smoke-not-a-secret
          chmod 600 "$key"
          echo "BT_RELEASE_STORE_FILE=$key" >> "$GITHUB_ENV"
          echo "BT_RELEASE_STORE_PASSWORD=ci-smoke-not-a-secret" >> "$GITHUB_ENV"
          echo "BT_RELEASE_KEY_ALIAS=ci-only-release" >> "$GITHUB_ENV"
          echo "BT_RELEASE_KEY_PASSWORD=ci-smoke-not-a-secret" >> "$GITHUB_ENV"
      - name: Build signed APK/AAB using throwaway key
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signed artifacts match throwaway keystore
        run: python3 scripts/verify_signed_candidate.py --report "$RUNNER_TEMP/signed-smoke.json"
      - name: Remove disposable signing key and signed artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ci-only-budget-tracker-signing.p12" \
            "$RUNNER_TEMP/signed-smoke.json" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
