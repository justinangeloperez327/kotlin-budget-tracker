name: Manual Android Release Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Verify release source configuration
        run: python3 scripts/verify_release_candidate.py --source-only
      - name: Build unsigned release outputs and release tests
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify package metadata and generate checksums
        run: python3 scripts/verify_release_candidate.py
      - name: Upload unsigned candidate (manual build, NOT a publishable release)
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-budget-tracker-unsigned-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release-candidate/audit.json
          retention-days: 7
          if-no-files-found: error
